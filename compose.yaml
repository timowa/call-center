x-php: &php
  build: .
  working_dir: /var/www/html
  volumes:
    - .:/var/www/html
    - vendor:/var/www/html/vendor
  environment:
    DB_CONNECTION: mysql
    DB_HOST: mysql
    DB_PORT: 3306

services:
  init:
    <<: *php
    command: ["composer", "install", "--no-interaction", "--prefer-dist"]
  app:
    <<: *php
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    depends_on:
      init:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
  queue:
    <<: *php
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--timeout=90"]
    profiles: ["queue"]
    depends_on:
      init:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
  vite:
    image: node:22-bookworm-slim
    working_dir: /var/www/html
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      DOCKER_VITE: "true"
      VITE_PORT: ${VITE_PORT:-5173}
    ports:
      - "127.0.0.1:${VITE_PORT:-5173}:${VITE_PORT:-5173}"
    volumes:
      - .:/var/www/html
      - node_modules:/var/www/html/node_modules
      - vendor:/var/www/html/vendor:ro
    depends_on:
      init:
        condition: service_completed_successfully
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-call_center}
      MYSQL_USER: ${DB_USERNAME:-call_center}
      MYSQL_PASSWORD: ${DB_PASSWORD:-local_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local_root_password}
    ports:
      - "127.0.0.1:${FORWARD_DB_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql -h 127.0.0.1 -u\"$$MYSQL_USER\" \"$$MYSQL_DATABASE\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
volumes:
  mysql_data:
  vendor:
  node_modules:
