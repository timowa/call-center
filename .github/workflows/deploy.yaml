name: Deploy Production to ISPManager

on:
  push:
    branches:
      - master
jobs:
  deploy:
    name: Deploy to Prod
    runs-on: ubuntu-latest

    steps:
      - name: Deploy
        uses: appleboy/ssh-action@v1
        with:
          host: 91.107.121.26
          username: call-center-ftp
          password: ${{ secrets.SSH_PASSWORD }}
          port: 21
          script: |


            git fetch origin
            git reset --hard origin/master

            composer install \
              --no-interaction \
              --prefer-dist \
              --no-dev \
              --optimize-autoloader

            npm ci
            npm run build

            php artisan migrate --force
            php artisan optimize:clear
            php artisan optimize

